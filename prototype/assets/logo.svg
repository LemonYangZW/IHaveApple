<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>IHaveApple</title>
  <!-- 标志：海棠果（长柄小苹果）+ 播放键。透明底，深色、浅色背景都可用。
       颜色取自设计 Token：海棠红 #E8436A、海棠深 #C42A52、字幕白 #F3EDE6 -->
  <!-- 果柄 -->
  <path d="M64 48 C63 36 66 24 73 14" fill="none" stroke="#C42A52" stroke-width="5" stroke-linecap="round"/>
  <!-- 叶子 -->
  <path d="M68 30 C74 16 90 10 104 14 C98 28 84 36 68 30 Z" fill="#C42A52"/>
  <!-- 果身 -->
  <path d="M64 46 C56 38 26 36 22 66 C19 90 38 116 54 114 C59 113.5 61 111 64 111 C67 111 69 113.5 74 114 C90 116 109 90 106 66 C102 36 72 38 64 46 Z" fill="#E8436A"/>
  <!-- 高光 -->
  <path d="M36 70 C37 60 43 53 51 50" fill="none" stroke="#F3EDE6" stroke-opacity="0.35" stroke-width="5" stroke-linecap="round"/>
  <!-- 播放键（圆角三角，视觉重心略向右以抵消三角形的左重） -->
  <path d="M57 66 L57 96 L83 81 Z" fill="#F3EDE6" stroke="#F3EDE6" stroke-width="6" stroke-linejoin="round"/>
</svg>
