name: release

# 推送 v* 标签：打包 Windows 版并发布到同名 Release。手动运行只打包，产物在 Actions 的 artifact 里
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      MPV_TAG: "20261111"                                 # shinchiro/mpv-winbuild-cmake 的发布
      # BtbN/FFmpeg-Builds 的 latest 发布。用 LGPL 静态版：只做解密转封装、HEIC 封面转码和抽首帧，
      # 用不到 GPL 版多出的 x264 / x265 等编码器，ffmpeg.exe 从 160 MB 降到 128 MB
      FFMPEG_ASSET: ffmpeg-n8.1-latest-win64-lgpl-8.1.zip
    steps:
      - uses: actions/checkout@v7

      # 不开 pip / Go 缓存：实测恢复缓存比直接装还慢（PySide6 的时间花在解包安装，Go 缓存主要是标准库编译结果），
      # 结束时还要额外保存缓存
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: actions/setup-go@v7
        with:
          go-version-file: sdk/hgd/go.mod
          cache: false

      - name: 测试内置签名
        working-directory: sdk/openhongguo
        run: go test ./internal/protocol/sign ./sdk/model

      - name: 安装 Python 依赖
        run: pip install -r prototype/requirements.txt pyinstaller

      - name: 下载 libmpv 和 ffmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force deps | Out-Null
          gh release download $env:MPV_TAG -R shinchiro/mpv-winbuild-cmake -p "mpv-dev-x86_64-2*.7z" -D deps
          7z x (Get-Item deps/mpv-dev-*.7z).FullName -odeps/mpv libmpv-2.dll -r
          gh release download latest -R BtbN/FFmpeg-Builds -p $env:FFMPEG_ASSET -D deps
          # 只解出 ffmpeg.exe（Expand-Archive 解整个包又慢又多出 ffplay / ffprobe）
          7z e "deps/$env:FFMPEG_ASSET" -odeps/ffmpeg ffmpeg.exe -r

      - name: 准备 Inno Setup
        shell: pwsh
        run: |
          function Find-Iscc {
            $cmd = Get-Command iscc -ErrorAction SilentlyContinue
            if ($cmd) { return $cmd.Source }
            $x86 = [Environment]::GetFolderPath("ProgramFilesX86")
            $candidates = @(
              (Join-Path $x86 "Inno Setup 7\ISCC.exe"),
              (Join-Path $env:ProgramFiles "Inno Setup 7\ISCC.exe"),
              (Join-Path $x86 "Inno Setup 6\ISCC.exe"),
              (Join-Path $env:ProgramFiles "Inno Setup 6\ISCC.exe")
            )
            foreach ($p in $candidates) { if ($p -and (Test-Path $p)) { return $p } }
          }
          $iscc = Find-Iscc
          if (-not $iscc) {
            Write-Host "环境里没有 Inno Setup，安装最新版"
            choco install innosetup -y --no-progress
            $iscc = Find-Iscc
          }
          if (-not $iscc) { throw "找不到 ISCC.exe" }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "ISCC：$iscc"

      - name: 打包
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0, 7))" }
          $mpv = (Get-ChildItem deps/mpv -Recurse -Filter libmpv-2.dll | Select-Object -First 1).FullName
          $ff  = (Get-ChildItem deps/ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName
          ./scripts/build-windows.ps1 -Version $ver -Mpv $mpv -Ffmpeg $ff -Iscc $env:ISCC

      - uses: actions/upload-artifact@v7
        with:
          name: IHaveApple-win64
          path: dist/*.exe

      - name: 验证发行包使用内置签名
        shell: pwsh
        run: |
          $cfg = Get-Content dist/IHaveApple/hgd/config.json -Raw | ConvertFrom-Json
          if ($cfg.signer_url) { throw "发行包不应依赖外部签名服务：signer_url=$($cfg.signer_url)" }
          if (-not (Test-Path dist/IHaveApple/hgd/ohgd.exe)) { throw "发行包缺少 hgd/ohgd.exe" }
          if (-not (Get-Item dist/IHaveApple-Setup-*.exe)) { throw "发行包缺少安装包" }

      - name: 发布到 Release
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $setup = (Get-Item dist/IHaveApple-Setup-*.exe).FullName
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "IHaveApple $tag" --notes-file .github/release-notes.md
          }
          gh release upload $tag $setup --clobber
